# XcodeGen spec for the Obscura macOS app target. The engine is pure SwiftPM (Package.swift).
# Regenerate with: xcodegen generate   (the .xcodeproj is git-ignored)
name: Obscura
options:
  bundleIdPrefix: io.github.xbtdmt
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    ARCHS: "arm64 x86_64"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
  # Signing identity lives in Apps/Obscura/Signing.xcconfig: ad-hoc by default, so anyone can build from a clone;
  # a Mac holding the "Obscura Self-Signed" certificate opts in with the git-ignored Signing.local.xcconfig, which
  # keeps one code identity across builds and updates (macOS then remembers folder access).
  configs:
    # Debug builds the running Mac's chip only (Xcode builds Swift packages that way in Debug); Release is universal.
    Debug:
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      ONLY_ACTIVE_ARCH: "NO"
      # Xcode adds the debug-only get-task-allow entitlement when signing manually with a non-distribution identity
      # (our self-signed one); it lets any same-user process read Obscura's memory. Release never carries it
      # (redman 2026-10-27; Scripts/check-app-signature.sh refuses a build that does).
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
      # G-38: an unstripped executable keeps its debug-map entries, which name the build Mac's source folder (a home
      # folder path). Release strips every symbol before signing; the debug symbols stay in the dSYM, which is not
      # published. Scripts/check-app-signature.sh --release refuses a bundle that still names a home folder.
      DEPLOYMENT_POSTPROCESSING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"
      STRIP_STYLE: all
      COPY_PHASE_STRIP: "YES"
configFiles:
  Debug: Apps/Obscura/Signing.xcconfig
  Release: Apps/Obscura/Signing.xcconfig
packages:
  ObscuraEngine:
    path: .
targets:
  Obscura:
    type: application
    platform: macOS
    sources:
      - path: Apps/Obscura
        excludes: ["Resources/Info.plist", "*.updatekey"]
      # G-33: the trigger for the build rule below, in the Sources phase so the rule runs and its Swift output compiles.
      - path: Apps/Obscura/UpdatePublicKey.updatekey
        buildPhase: sources
    # G-33: compiles the OBSCURA_UPDATE_PUBLIC_KEY build setting (Apps/Obscura/Update.xcconfig) into the executable as
    # UpdateBuildConfig.publicKey. The build fails on anything that is neither the placeholder nor a base64 32-byte key.
    # Xcode re-runs the rule when the setting changes. Once per build, not per architecture (one output for both).
    buildRules:
      - name: Update public key
        filePattern: "*.updatekey"
        runOncePerArchitecture: false
        outputFiles: ["$(DERIVED_FILE_DIR)/UpdateBuildConfig.swift"]
        script: |
          key="${OBSCURA_UPDATE_PUBLIC_KEY}"
          if [ "$key" != "REPLACE_WITH_OBSCURA_UPDATE_PUBLIC_KEY" ] && ! printf '%s' "$key" | /usr/bin/grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            echo "error: OBSCURA_UPDATE_PUBLIC_KEY must be the base64 raw 32-byte Ed25519 public key (obscura release public-key)"
            exit 1
          fi
          out="${DERIVED_FILE_DIR}/UpdateBuildConfig.swift"
          printf '// Generated by the "Update public key" build rule (project.yml). Do not edit.\nenum UpdateBuildConfig {\n    static let publicKey = "%s"\n}\n' "$key" > "$out.tmp"
          if /usr/bin/cmp -s "$out.tmp" "$out"; then /bin/rm "$out.tmp"; else /bin/mv "$out.tmp" "$out"; fi
    dependencies:
      - package: ObscuraEngine
        product: ObscuraSupport
      - package: ObscuraEngine
        product: ObscuraPrefs
      - package: ObscuraEngine
        product: ObscuraJournal
      - package: ObscuraEngine
        product: ObscuraCapture
      - package: ObscuraEngine
        product: ObscuraOCR
      - package: ObscuraEngine
        product: ObscuraEngine
      - package: ObscuraEngine
        product: ObscuraSearch
      - package: ObscuraEngine
        product: ObscuraUIKit
      - package: ObscuraEngine
        product: ObscuraAppUI
      - package: ObscuraEngine
        product: ObscuraUpdate
    info:
      path: Apps/Obscura/Resources/Info.plist
      properties:
        CFBundleName: Obscura
        CFBundleDisplayName: Obscura
        CFBundleIdentifier: io.github.xbtdmt.obscura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 XBTDMT. Obscura is free software (GPL-3.0-or-later)."
        NSDesktopFolderUsageDescription: "Obscura checks new screenshots on your Desktop for secrets before you share them."
        NSDocumentsFolderUsageDescription: "Obscura checks new screenshots in your screenshot folder for secrets before you share them."
        NSDownloadsFolderUsageDescription: "Obscura checks new images in Downloads for secrets before you share them."
        # G-33: the signed update feed (OBSCURA_UPDATE_FEED_URL in Apps/Obscura/Update.xcconfig).
        ObscuraUpdateFeedURL: $(OBSCURA_UPDATE_FEED_URL)
        # G-38: the identity an earlier build of this copy ran under (OBSCURA_PREVIOUS_IDENTITY in
        # Apps/Obscura/Identity.xcconfig): empty in every public build; IdentityMigration reads it.
        ObscuraPreviousIdentity: $(OBSCURA_PREVIOUS_IDENTITY)
        NSUserNotificationAlertStyle: banner
    # G-33 (ruled 2026-10-28, supersedes G-11): no entitlements at all. Library validation is ON (Sparkle, the
    # only embedded framework, is gone) and the hardened runtime carries no exception. Scripts/check-app-signature.sh
    # refuses any com.apple.security.cs.* key.
    entitlements:
      path: Apps/Obscura/Obscura.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.xbtdmt.obscura
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_PREVIEWS: "YES"
        # G-33: library validation stated in the signature itself (flags=library-validation,runtime), not only
        # implied by the hardened runtime. Xcode merges this with its own "-o runtime".
        OTHER_CODE_SIGN_FLAGS: "-o library"
        # Xcode's Debug-only Obscura.debug.dylib is ad-hoc code that library validation refuses for a team-less identity
        # (G-11's evidence: "different Team IDs"); with it off the Debug app is one executable, like Release.
        ENABLE_DEBUG_DYLIB: "NO"
  ObscuraUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Apps/ObscuraUITests]
    dependencies:
      - target: Obscura
schemes:
  Obscura:
    build:
      targets: { Obscura: all, ObscuraUITests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [ObscuraUITests]
    archive:
      config: Release
