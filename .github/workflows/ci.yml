name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Build (release)
        run: swift build -c release
      - name: Test
        env: { CI: "1" }
        run: swift test 2>&1 | tee test.log; grep -q '✘' test.log && exit 1 || true
      - name: Fixture secret-shape scan
        run: Scripts/scan-fixtures-for-real-secrets.sh
  app:
    runs-on: macos-15
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build app (unsigned)
        run: xcodebuild -project Obscura.xcodeproj -scheme Obscura -configuration Release -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO | tail -20
