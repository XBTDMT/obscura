name: CI
# Every step fails the job when its command fails: bash runs with -eo pipefail, and no output is piped through tail or
# filtered with `|| true` (2026-10-28: both jobs reported success while the tests did not compile and the app build
# failed on Xcode 26.3). Two toolchains: the newest stable Xcode on GitHub's macOS 26 image (what most people build
# with) and the Xcode 27 preview image (what the release Mac builds with).
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, xcode: latest-stable }
          - { runner: xcode-27, xcode: latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "${{ matrix.xcode }}" }
      - run: xcodebuild -version && swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        env: { CI: "1" }
        run: swift test
      - name: Fixture secret-shape scan
        run: Scripts/scan-fixtures-for-real-secrets.sh
  app:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, xcode: latest-stable }
          - { runner: xcode-27, xcode: latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "${{ matrix.xcode }}" }
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          if ! xcodebuild -project Obscura.xcodeproj -scheme Obscura -configuration Release -destination 'generic/platform=macOS' \
               -onlyUsePackageVersionsFromResolvedFile build CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -nE 'error:|\*\* BUILD' build.log > errors.txt || true   # display only; the build's status decides
            head -80 errors.txt
            tail -60 build.log
            exit 1
          fi
          grep -E '\*\* BUILD' build.log
