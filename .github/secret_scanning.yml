# GitHub secret scanning and push protection skip Obscura's made-up test credentials (G-41).
# Obscura is a secret detector: its tests need text shaped exactly like real provider tokens. Every one is made up
# (project rule), and Scripts/scan-fixtures-for-real-secrets.sh fails CI on any live-looking shape not on the allowlist
# of generator outputs. Push protection still covers the app, the engine, the tools, the scripts and the docs.
paths-ignore:
  - "Tests/**"
  - "Sources/ObscuraUIKit/SampleData.swift"
